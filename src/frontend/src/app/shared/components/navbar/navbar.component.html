<header class="bg-white border-b border-gray-200 px-6 py-4 flex items-center justify-between">
  <h2 class="text-xl font-semibold text-slate-800">{{ title }}</h2>
  <div class="flex items-center gap-4">
    <span class="text-slate-600">👤 {{ auth.currentUser()?.firstName }} {{ auth.currentUser()?.lastName }}</span>
    <button (click)="auth.logout()" class="text-red-500 hover:text-red-700 text-sm">Çıkış</button>
  </div>
</header>
