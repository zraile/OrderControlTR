<aside class="w-64 bg-slate-800 text-white flex flex-col h-screen fixed left-0 top-0">
  <div class="p-6 border-b border-slate-700">
    <h1 class="text-xl font-bold text-green-400">🍽️ OrderControlTR</h1>
  </div>
  <nav class="flex-1 p-4 space-y-1">
    <a *ngFor="let item of navItems"
       [routerLink]="item.path"
       routerLinkActive="bg-slate-700 text-green-400"
       class="flex items-center gap-3 px-4 py-3 rounded-lg hover:bg-slate-700 transition-colors text-slate-300 hover:text-white">
      <span>{{ item.icon }}</span>
      <span>{{ item.label }}</span>
    </a>
  </nav>
  <div class="p-4 border-t border-slate-700">
    <div class="text-sm text-slate-400 mb-2">{{ auth.currentUser()?.firstName }} {{ auth.currentUser()?.lastName }}</div>
    <button (click)="auth.logout()" class="w-full text-left px-4 py-2 text-red-400 hover:text-red-300 hover:bg-slate-700 rounded-lg transition-colors">
      🚪 Çıkış Yap
    </button>
  </div>
</aside>
