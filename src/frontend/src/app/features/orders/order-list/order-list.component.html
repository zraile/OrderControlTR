<app-navbar title="Siparişler"></app-navbar>
<div class="p-6 overflow-auto flex-1">
  <div class="flex gap-4 mb-6">
    <select [(ngModel)]="statusFilter" (change)="applyFilter()"
      class="px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-green-500">
      <option value="">Tüm Durumlar</option>
      <option value="1">Yeni</option>
      <option value="2">Hazırlanıyor</option>
      <option value="3">Hazır</option>
      <option value="4">Teslim Edildi</option>
      <option value="5">İptal</option>
    </select>
    <a routerLink="/orders/new/0" class="ml-auto bg-green-500 hover:bg-green-600 text-white px-4 py-2 rounded-lg">+ Yeni Sipariş</a>
  </div>

  <div class="bg-white rounded-xl shadow-sm border border-gray-100">
    <table class="w-full">
      <thead>
        <tr class="text-left text-slate-500 text-sm border-b border-gray-100">
          <th class="px-6 py-3">No</th>
          <th class="px-6 py-3">Masa</th>
          <th class="px-6 py-3">Tutar</th>
          <th class="px-6 py-3">Durum</th>
          <th class="px-6 py-3">Tarih</th>
          <th class="px-6 py-3">İşlemler</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let order of filtered" class="border-b border-gray-50 hover:bg-gray-50">
          <td class="px-6 py-4 font-mono">#{{ order.id }}</td>
          <td class="px-6 py-4">{{ order.tableName || ('Masa ' + order.tableId) }}</td>
          <td class="px-6 py-4 font-semibold">{{ order.totalAmount | currencyTr }}</td>
          <td class="px-6 py-4">
            <span [class]="'px-2 py-1 rounded-full text-xs font-medium ' + getStatusClass(order.status)">
              {{ getStatusLabel(order.status) }}
            </span>
          </td>
          <td class="px-6 py-4 text-slate-500 text-sm">{{ order.createdAt | date:'dd.MM.yyyy HH:mm' }}</td>
          <td class="px-6 py-4">
            <a [routerLink]="['/orders', order.id]" class="text-blue-600 hover:text-blue-700 text-sm mr-3">Detay</a>
          </td>
        </tr>
        <tr *ngIf="filtered.length === 0">
          <td colspan="6" class="px-6 py-8 text-center text-slate-400">Sipariş bulunamadı</td>
        </tr>
      </tbody>
    </table>
  </div>
</div>
