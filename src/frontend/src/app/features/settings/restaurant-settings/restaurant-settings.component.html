<app-navbar title="Ayarlar"></app-navbar>
<div class="p-6 overflow-auto flex-1">
  <div class="max-w-2xl">
    <!-- Restaurant Settings -->
    <div class="bg-white rounded-xl shadow-sm border border-gray-100 p-6 mb-6">
      <h3 class="font-semibold text-lg mb-4">Restoran Bilgileri</h3>
      <div class="space-y-4">
        <div>
          <label class="block text-sm font-medium text-slate-700 mb-1">Restoran Adı</label>
          <input [(ngModel)]="restaurantForm.name" class="w-full px-3 py-2 border border-gray-300 rounded-lg">
        </div>
        <div>
          <label class="block text-sm font-medium text-slate-700 mb-1">Adres</label>
          <textarea [(ngModel)]="restaurantForm.address" class="w-full px-3 py-2 border border-gray-300 rounded-lg h-20 resize-none"></textarea>
        </div>
        <div class="grid grid-cols-2 gap-4">
          <div>
            <label class="block text-sm font-medium text-slate-700 mb-1">Telefon</label>
            <input [(ngModel)]="restaurantForm.phoneNumber" class="w-full px-3 py-2 border border-gray-300 rounded-lg">
          </div>
          <div>
            <label class="block text-sm font-medium text-slate-700 mb-1">Vergi No</label>
            <input [(ngModel)]="restaurantForm.taxNumber" class="w-full px-3 py-2 border border-gray-300 rounded-lg">
          </div>
        </div>
        <div *ngIf="saved" class="text-green-600 text-sm">✅ Kaydedildi!</div>
        <button (click)="saveRestaurant()" class="bg-green-500 hover:bg-green-600 text-white px-6 py-2 rounded-lg font-medium">Kaydet</button>
      </div>
    </div>

    <!-- Branches -->
    <div class="bg-white rounded-xl shadow-sm border border-gray-100 p-6">
      <div class="flex items-center justify-between mb-4">
        <h3 class="font-semibold text-lg">Şubeler</h3>
        <button (click)="showBranchForm = !showBranchForm" class="bg-green-500 hover:bg-green-600 text-white px-4 py-2 rounded-lg text-sm">+ Şube Ekle</button>
      </div>

      <div *ngIf="showBranchForm" class="bg-gray-50 rounded-lg p-4 mb-4 space-y-3">
        <input [(ngModel)]="branchForm.name" placeholder="Şube adı" class="w-full px-3 py-2 border border-gray-300 rounded-lg">
        <input [(ngModel)]="branchForm.address" placeholder="Adres" class="w-full px-3 py-2 border border-gray-300 rounded-lg">
        <input [(ngModel)]="branchForm.phoneNumber" placeholder="Telefon" class="w-full px-3 py-2 border border-gray-300 rounded-lg">
        <button (click)="saveBranch()" class="bg-green-500 text-white px-4 py-2 rounded-lg text-sm">Kaydet</button>
      </div>

      <div class="space-y-3">
        <div *ngFor="let branch of branches" class="flex items-center justify-between p-3 bg-gray-50 rounded-lg">
          <div>
            <div class="font-medium">{{ branch.name }}</div>
            <div class="text-slate-500 text-sm">{{ branch.address }}</div>
          </div>
          <button (click)="deleteBranch(branch)" class="text-red-400 hover:text-red-600">🗑️</button>
        </div>
        <div *ngIf="branches.length === 0" class="text-slate-400 text-sm text-center py-4">Henüz şube bulunmuyor</div>
      </div>
    </div>
  </div>
</div>
